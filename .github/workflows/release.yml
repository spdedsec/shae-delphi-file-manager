name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package release artifact
        run: |
          zip -r shae-delphi-file-manager-${{ github.ref_name }}.zip \
            src scripts Makefile README.md DESIGN.md LICENSE docs

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            SHAE File Manager v${{ github.ref_name }}

            Console-based file manager in Free Pascal / Delphi.
            Browse, navigate, open files. See README.md.
          files: shae-delphi-file-manager-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
